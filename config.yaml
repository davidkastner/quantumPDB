#######
# RUN #
#######
# Initialization parameters
input: example/basics/proteins.csv     # Path to protein CSV, single PDB, local path, or list [PDB1, PDB2]
output_dir: dataset                    # Path to save the generated clusters
convert_to_nhie_oxo: false             # Convert A-KG NHIEs to succinate-oxo NHIEs (special workflow)
max_clash_refinement_iter: 5           # Max Modeller--Protoss clash iterations (inactive under Protoss API v2)

# Cluster model parameters
max_atom_count: null
center_residues: [FE]                  # Residue name(s) to use as the cluster center
additional_ligands: []                 # Residues forced into the first sphere
number_of_spheres: 2                   # Coordination spheres to generate
radius_of_first_sphere: 4.0            # Distance cutoff for the first sphere
include_ligands: 2                     # 0 = first sphere only, 1 = non-water ligands, 2 = all ligands/waters
capping_method: 1                      # Cap residues with None (0), hydrogens (1), ACE/NME (2)
smoothing_method: 2                    # 0 = box plot, 1 = DBSCAN, 2 = dummy atom, 3 = none
merge_distance_cutoff: 0.0             # Merge nearby centers within this distance (Angstrom)
cluster_name_template: null            # Optional name template, e.g. "A_{radius}"; null uses metal_id
write_hetero_pdb: false                # Include HETATM records in combined cluster PDBs

# Output parameters
compute_charges: true                  # Calculate charges using Protoss output
count_residues: true                   # Count the number of residues
write_xyz: true                        # Write out xyz files

##########
# SUBMIT #
##########
# Create QM job files (TeraChem)
optimization: false                    # Optimization (true) or single point (false)
method: wpbeh                          # Functional to use
basis: lacvps_ecp                      # Basis set to use
guess: generate                        # Method for initial guess
gpus: 1                                # How many GPUs to use
memory: 8G                             # How much memory to use
dielectric: 10                         # Dielectric for implicit solvent
use_implicit_solvent: true             # PCM/COSMO; set false to disable, or true with charge_embedding for both
charge_embedding: false                # Prepare QM with MM point-charge embedding
charge_embedding_cutoff: 20            # Residue-level embedding cutoff (Angstrom)
charge_embedding_charges: null         # Path to custom charges JSON (null uses built-in ff14SB)
scheduler: slurm                       # Scheduler: slurm or sge
pcm_radii_file: pcm_radii              # Path to the pcm_radii file for TeraChem

# Submit QM jobs
create_jobs: false                     # Create QM job input files
submit_jobs: false                     # Submit the created jobs
job_count: 80                          # Maximum number of jobs to maintain on the scheduler

###########
# ANALYZE #
###########
job_checkup: false                     # Check status of QM jobs
delete_queued: false                   # Delete .submit_record for unfinished jobs
multiwfn_path: Multiwfn                # Multiwfn executable or path
charge_scheme: Hirshfeld               # One of: Hirshfeld, Voronoi, Mulliken, ADCH, Hirshfeld-I, CM5
calc_charge_schemes: false             # Calculate charge schemes with Multiwfn
calc_dipole: false                     # Calculate dipole with Multiwfn (center of mass reference)
=======
convert_to_oxo: true                   # Used to convert A-KG NHIEs to Succinate-Oxo NHIEs, usually False
compute_charges: false
max_clash_refinement_iter: 5           # The max number of times to iterate over the modeller protoss loop 
# Cluster model parameters
max_atom_count: 750            
center_residues: [FE1]             # Residue name to use as the cluster center
additional_ligands: []                 # Residues beyond first sphere to include
number_of_spheres: 3                   # Coordination spheres to generate
radius_of_first_sphere: 2.0            # Distance based cut off to determine first sphere
include_ligands: 2                     # Only ligands and waters in first sphere (0), Only non-water ligands (1), Everything (2)
capping_method: 0                      # Cap residues with None (0), hydrogens (1), ACE/NME (2)
smoothing_method: 2                    # Smoothing method Box plot (0), DBSCAN (1), [Dummy Atom] (2), None (3)
cluster_name_template: null            # Optional format-string for cluster folder/file names, e.g. "A_{radius}"; fields: radius, metal_id, index, pdb. Default (null) names clusters by residue ID as before.
# Output parameters                               
count_residues: true                   # Count the number of residues
write_xyz: true                        # Write out xyz files
